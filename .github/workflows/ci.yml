name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            archive: janet-v1.42.1-linux-x64.tar.gz
            digest: 5c6cd9862c59b0691e2fd3b2e2327d1459d314a67dd08203fbff372937a20748
          - os: macos-15
            archive: janet-v1.42.1-macos-aarch64.tar.gz
            digest: 53eaa09807764b246cbb7aa1a7a8bbc34a0d783f11187f00b1cf07f9b24e85cb
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          DIGEST: ${{ matrix.digest }}
        run: |
          destination="$RUNNER_TEMP/pa-janet"
          mkdir -p "$destination"
          curl -fsSL "https://github.com/janet-lang/janet/releases/download/v1.42.1/$ARCHIVE" -o "$RUNNER_TEMP/janet.tar.gz"
          test "$(shasum -a 256 "$RUNNER_TEMP/janet.tar.gz" | cut -d ' ' -f 1)" = "$DIGEST"
          tar -xzf "$RUNNER_TEMP/janet.tar.gz" --strip-components=2 -C "$destination"
          echo "$destination/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$destination/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$destination/lib" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\janet.msi"
          Invoke-WebRequest https://github.com/janet-lang/janet/releases/download/v1.42.1/janet-1.42.1-windows-x64-installer.msi -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'ee5833f9969361e1ecec63292f7ead17af5465716943f7eaf2d34231c8f7d958') { throw 'Janet checksum mismatch' }
          $destination = "$env:RUNNER_TEMP\pa-janet"
          $installer = Start-Process msiexec.exe -ArgumentList '/i', $archive, '/qn', "APPLICATIONFOLDER=$destination" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Janet installation failed: $($installer.ExitCode)" }
          "$destination\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: janet -v
      - run: deno task check
      - run: deno publish --dry-run
