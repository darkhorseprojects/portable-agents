name: portable-agents

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with: { version: 0.16.0 }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - name: Verify Zig
        run: |
          zig fmt --check build.zig src
          zig build -Doptimize=ReleaseSafe
      - name: Verify TypeScript SDK
        run: |
          deno fmt --check
          deno lint --rules-exclude=no-slow-types
          deno check --frozen sdk/mod.ts
          deno publish --dry-run --frozen-lockfile

  publish-jsr:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - run: deno publish --frozen-lockfile

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, id: linux-x86_64, suffix: "", archive: tar.gz }
          - {
              os: ubuntu-24.04-arm,
              id: linux-aarch64,
              suffix: "",
              archive: tar.gz,
            }
          - { os: macos-13, id: macos-x86_64, suffix: "", archive: tar.gz }
          - { os: macos-14, id: macos-aarch64, suffix: "", archive: tar.gz }
          - {
              os: windows-latest,
              id: windows-x86_64,
              suffix: ".exe",
              archive: zip,
            }
          - {
              os: windows-11-arm,
              id: windows-aarch64,
              suffix: ".exe",
              archive: zip,
            }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with: { version: 0.16.0 }
      - name: Build and package
        shell: bash
        run: |
          zig build -Doptimize=ReleaseSafe
          archive="portable-agents-${GITHUB_REF_NAME}-${{ matrix.id }}"
          mkdir "$archive"
          cp "zig-out/bin/agent${{ matrix.suffix }}" README.md LICENSE "$archive/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            ROOT="$archive" pwsh -NoProfile -Command 'Compress-Archive $env:ROOT ($env:ROOT + ".zip")'
          else
            tar -czf "$archive.tar.gz" "$archive"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-agents-${{ matrix.id }}
          path: portable-agents-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-jsr
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {
          pattern: portable-agents-*,
          path: artifacts,
          merge-multiple: true,
        }
      - run: cd artifacts && sha256sum portable-agents-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with: { files: "artifacts/*", generate_release_notes: true }
