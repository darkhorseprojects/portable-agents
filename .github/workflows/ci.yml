name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-24.04","id":"linux-x86_64"},{"os":"ubuntu-24.04-arm","id":"linux-aarch64"},{"os":"macos-15-intel","id":"macos-x86_64"},{"os":"macos-15","id":"macos-aarch64"},{"os":"windows-latest","id":"windows-x86_64"},{"os":"windows-11-arm","id":"windows-aarch64"}]' || '[{"os":"ubuntu-24.04","id":"linux-x86_64"},{"os":"macos-15","id":"macos-aarch64"},{"os":"windows-latest","id":"windows-x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: portable-agents, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: janet-lang/janet
          ref: e1963cdfe0148f83601907727e00bd672d798115
          path: janet
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: janet-lang/jpm
          ref: 029d0c4cfefd2d359ddc5344eae61a1771f4e673
          path: jpm
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        if: matrix.id == 'linux-x86_64'
        with: { deno-version: v2.9.7 }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with: { arch: "${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}" }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: toolchain
        with:
          path: ${{ runner.os == 'Windows' && 'janet' || format('{0}/janet', runner.temp) }}
          key: ${{ matrix.os }}-${{ runner.arch }}-janet-e1963cdfe0148f83601907727e00bd672d798115-jpm-029d0c4cfefd2d359ddc5344eae61a1771f4e673
      - name: Prepare native toolchain
        shell: python
        env: { CACHED: "${{ steps.toolchain.outputs.cache-hit }}" }
        run: |
          import os, pathlib, shutil, subprocess
          windows = os.name == "nt"
          source = pathlib.Path("janet").resolve()
          prefix = source if windows else pathlib.Path(os.environ["RUNNER_TEMP"]) / "janet"
          if os.environ["CACHED"] != "true":
              if windows:
                  subprocess.run(["cmd", "/c", "build_win.bat"], cwd=source, check=True)
                  subprocess.run([str(source / "janet.exe"), "tools/patch-header.janet", "src/include/janet.h", "src/conf/janetconf.h", "build/janet.h"], cwd=source, check=True)
                  shutil.copyfile(source / "janet.lib", source / "build/janet.lib")
              else:
                  subprocess.run(["make", "-C", str(source), "-j2", f"PREFIX={prefix}"], check=True)
                  subprocess.run(["make", "-C", str(source), "install", f"PREFIX={prefix}"], check=True)
          library = source / "build" if windows else prefix / "lib"
          modules = prefix / ("lib" if windows else "lib/janet")
          env = {"PREFIX": prefix, "JANET_HEADERPATH": source / "build" if windows else prefix / "include/janet",
                 "JANET_LIBPATH": library, "JANET_BINPATH": prefix / "bin", "JANET_MODPATH": modules,
                 "JANET_PATH": modules, "LD_LIBRARY_PATH": library, "DYLD_LIBRARY_PATH": library}
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.writelines(f"{key}={value}\n" for key, value in env.items())
          with open(os.environ["GITHUB_PATH"], "a") as out:
              if windows: out.write(f"{source}\n")
              out.write(f"{prefix / 'bin'}\n")
      - name: Install pinned Jpm
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: jpm
        run: janet bootstrap.janet
      - name: Check SDK
        if: matrix.id == 'linux-x86_64'
        working-directory: portable-agents
        run: deno task check
      - name: Compile native boundary
        working-directory: portable-agents
        run: jpm build
      - name: Exercise native transport
        working-directory: portable-agents
        shell: python
        run: |
          import base64, json, os, pathlib, subprocess
          program = {"sourceDir": str(pathlib.Path.cwd()), "entryModule": "src/protocol.janet", "entry": "base64"}
          request = {"version": 1, "program": program, "input": "WVE9PQ==", "config": ""}
          executable = "build/agent.exe" if os.name == "nt" else "build/agent"
          result = subprocess.run([executable, "spawn", "1048576", "32", "5"], input=json.dumps(request)+"\n", text=True, capture_output=True, timeout=10, check=True)
          frames = [json.loads(line) for line in result.stdout.splitlines()]
          assert [frame["type"] for frame in frames] == ["ready", "result"], frames
          assert base64.b64decode(frames[-1]["output"]) == b"a"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: agent-${{ matrix.id }}
          path: ${{ runner.os == 'Windows' && 'portable-agents/build/agent.exe' || 'portable-agents/build/agent' }}
          if-no-files-found: error
