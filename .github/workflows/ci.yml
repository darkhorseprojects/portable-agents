name: portable-agents

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with: { version: 0.16.0 }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - name: Verify source
        run: |
          zig fmt --check build.zig src
          deno fmt --check
          deno lint --rules-include=no-slow-types
          deno check --frozen sdk/mod.ts
          deno publish --dry-run
          deno_version=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')
          zig_version=$(awk -F'"' '/^[[:space:]]*[.]version =/{print $2; exit}' build.zig.zon)
          test "$deno_version" = "$zig_version"
      - name: Verify tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"

  build-unix:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, id: linux-x86_64 }
          - { os: ubuntu-26.04-arm, id: linux-aarch64 }
          - { os: macos-15-intel, id: macos-x86_64 }
          - { os: macos-15, id: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with: { version: 0.16.0 }
      - name: Install Lua on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes liblua5.5-dev pkgconf
      - name: Install Lua on macOS
        if: runner.os == 'macOS'
        run: brew install lua pkgconf
      - name: Build and test
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseSafe
          if [[ "$RUNNER_OS" == macOS ]]; then
            otool -L zig-out/bin/agent | grep -F '@rpath/liblua.5.5.dylib'
            ! otool -L zig-out/bin/agent | grep -E '/(usr/local|opt/homebrew)/.*liblua'
          else
            readelf -d zig-out/bin/agent | grep -F 'Shared library: [liblua5.5.so.0]'
          fi
          mkdir smoke
          printf '%s\n' 'return setmetatable({}, {__call=function() return "ok" end})' > smoke/entry.lua
          output=$(printf '%s' '{"version":1,"emits":false,"agents":[{"sourceDir":"smoke","entryModule":"entry","limits":{}}],"imports":[],"input":"","config":""}' | zig-out/bin/agent call)
          grep -F '"output":"b2s="' <<< "$output"
      - name: Package
        if: github.event_name != 'pull_request'
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("deno.json"))["version"])')
          root="portable-agents-v${version}-${TARGET_ID}"
          mkdir "$root"
          cp zig-out/bin/agent README.md LICENSE "$root/"
          tar -czf "$root.tar.gz" "$root"
          mkdir verify-archive
          tar -xzf "$root.tar.gz" -C verify-archive
          test -x "verify-archive/$root/agent"
          test "$(find "verify-archive/$root" -maxdepth 1 -type f | wc -l)" -eq 3
          ! find "verify-archive/$root" -iname '*lua*' | grep .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        with:
          name: portable-agents-${{ matrix.id }}
          path: portable-agents-*.tar.gz
          if-no-files-found: error

  build-windows:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x86_64
            target: x86_64-windows-gnu
            prefix: ucrt64
            lua-url: https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-lua-5.5.1-1-any.pkg.tar.zst
            lua-sha256: 0365515318bd4c2027a8e86970d3b2bba8b4257254d1041d960bca165a43843e
          - id: windows-aarch64
            target: aarch64-windows-gnu
            prefix: clangarm64
            lua-url: https://repo.msys2.org/mingw/clangarm64/mingw-w64-clang-aarch64-lua-5.5.1-1-any.pkg.tar.zst
            lua-sha256: c4427b84430c3a05b245f190492f3ec2916ef78e1d239e8450bcb5e91f84d98a
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with: { version: 0.16.0 }
      - run: sudo apt-get update && sudo apt-get install --yes pkgconf zstd
      - name: Build Windows target
        run: |
          set -euo pipefail
          mkdir sysroot output
          curl --fail --location --silent --show-error '${{ matrix.lua-url }}' --output lua.pkg.tar.zst
          echo '${{ matrix.lua-sha256 }}  lua.pkg.tar.zst' | sha256sum --check
          tar --zstd -xf lua.pkg.tar.zst -C sysroot
          PKG_CONFIG_PATH="$PWD/sysroot/${{ matrix.prefix }}/lib/pkgconfig" \
          PKG_CONFIG_SYSROOT_DIR="$PWD/sysroot" \
            zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} \
              -Dlua-library="$PWD/sysroot/${{ matrix.prefix }}/lib/liblua.dll.a"
          cp zig-out/bin/agent.exe output/
          printf '%s' '${{ matrix.lua-url }}' > output/lua-url
          printf '%s' '${{ matrix.lua-sha256 }}' > output/lua-sha256
          printf '%s' '${{ matrix.prefix }}' > output/lua-prefix
          file output/agent.exe | grep -F '${{ matrix.target == 'aarch64-windows-gnu' && 'ARM64' || 'x86-64' }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build-${{ matrix.id }}
          path: output
          if-no-files-found: error

  test-windows:
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, id: windows-x86_64 }
          - { os: windows-11-arm, id: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-build-${{ matrix.id }}
          path: build
      - name: Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = Get-Content build/lua-url -Raw
          $expected = Get-Content build/lua-sha256 -Raw
          $prefix = Get-Content build/lua-prefix -Raw
          Invoke-WebRequest $url -OutFile lua.pkg.tar.zst
          if ((Get-FileHash lua.pkg.tar.zst -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Lua checksum mismatch' }
          7z x lua.pkg.tar.zst
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory runtime
          7z x lua.pkg.tar -oruntime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:Path = "$(Resolve-Path "runtime/$prefix/bin");$env:Path"
          New-Item -ItemType Directory smoke
          Set-Content -NoNewline -Path smoke/entry.lua -Value 'return setmetatable({}, {__call=function() return "ok" end})'
          & build/agent.exe check smoke entry
          Write-Host "direct-check exit=$LASTEXITCODE"
          cmd.exe /d /c 'build\agent.exe check smoke entry'
          Write-Host "cmd-check exit=$LASTEXITCODE"
          $request = '{"version":1,"emits":false,"agents":[{"sourceDir":"smoke","entryModule":"entry","limits":{}}],"imports":[],"input":"","config":""}'
          [IO.File]::WriteAllText('request.json', $request, [Text.UTF8Encoding]::new($false))
          Write-Host "request bytes=$([IO.File]::ReadAllBytes('request.json').Length)"
          cmd.exe /d /c 'build\agent.exe call < request.json > response.json 2> stderr.txt'
          $exitCode = $LASTEXITCODE
          Write-Host "call exit=$exitCode"
          Write-Host "response=$([IO.File]::ReadAllText('response.json'))"
          Write-Host "stderr=$([IO.File]::ReadAllText('stderr.txt'))"
          if ($exitCode -ne 0) { exit $exitCode }
          if (((Get-Content response.json -Raw | ConvertFrom-Json).result.output) -ne 'b2s=') { throw 'runtime smoke test failed' }
      - name: Package
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content deno.json -Raw | ConvertFrom-Json).version
          $root = "portable-agents-v$version-$env:TARGET_ID"
          New-Item -ItemType Directory $root
          Copy-Item build/agent.exe, README.md, LICENSE $root
          Compress-Archive $root "$root.zip"
          Expand-Archive "$root.zip" verify-archive
          $files = Get-ChildItem "verify-archive/$root" -File
          if ($files.Count -ne 3 -or -not (Test-Path "verify-archive/$root/agent.exe") -or ($files.Name -match 'lua')) { throw 'invalid archive contents' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        with:
          name: portable-agents-${{ matrix.id }}
          path: portable-agents-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [build-unix, test-windows]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: portable-agents-*
          path: artifacts
          merge-multiple: true
      - name: Verify release assets
        working-directory: artifacts
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("../deno.json"))["version"])')
          for id in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            test -f "portable-agents-v${version}-${id}.tar.gz"
          done
          for id in windows-x86_64 windows-aarch64; do
            test -f "portable-agents-v${version}-${id}.zip"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 6
          sha256sum portable-agents-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: artifacts/*
          body_path: RELEASE_NOTES.md

  publish-jsr:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - run: deno publish
