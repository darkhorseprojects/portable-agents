name: portable-agents

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - run: sudo apt-get update && sudo apt-get install --yes liblua5.5-dev pkgconf
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with: { version: 0.16.0 }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - name: Verify Zig
        run: |
          zig fmt --check build.zig src
          zig build -Doptimize=ReleaseSafe
      - name: Verify TypeScript SDK
        run: |
          deno fmt --check
          deno lint --rules-include=no-slow-types
          deno check --frozen sdk/mod.ts
          deno publish --dry-run

  publish-jsr:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - run: deno publish

  build:
    if: github.event_name == 'push'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, id: linux-x86_64, suffix: "", archive: tar.gz }
          - {
              os: ubuntu-26.04-arm,
              id: linux-aarch64,
              suffix: "",
              archive: tar.gz,
            }
          - {
              os: macos-15-intel,
              id: macos-x86_64,
              suffix: "",
              archive: tar.gz,
            }
          - { os: macos-15, id: macos-aarch64, suffix: "", archive: tar.gz }
          - {
              os: windows-latest,
              id: windows-x86_64,
              suffix: ".exe",
              archive: zip,
            }
          - {
              os: windows-11-arm,
              id: windows-aarch64,
              target: aarch64-windows-gnu,
              suffix: ".exe",
              archive: zip,
            }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        if: matrix.id != 'windows-aarch64'
        with: { version: 0.16.0 }
      - name: Install x86 Zig on Windows ARM
        if: matrix.id == 'windows-aarch64'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'zig-x64.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'zig-x64')
          Join-Path $env:RUNNER_TEMP 'zig-x64/zig-x86_64-windows-0.16.0' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install Lua on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes liblua5.5-dev pkgconf
      - name: Install Lua on macOS
        if: runner.os == 'macOS'
        run: brew install lua pkgconf
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.id == 'windows-aarch64' && 'CLANGARM64' || 'UCRT64' }}
          path-type: inherit
          update: true
          pacboy: lua:p pkgconf:p
      - name: Build and package
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: |
          zig build -Doptimize=ReleaseSafe ${{ matrix.target && format('-Dtarget={0}', matrix.target) || '' }}
          archive="portable-agents-${GITHUB_REF_NAME}-${{ matrix.id }}"
          mkdir "$archive"
          cp "zig-out/bin/agent${{ matrix.suffix }}" README.md LICENSE "$archive/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            ROOT="$archive" pwsh -NoProfile -Command 'Compress-Archive $env:ROOT ($env:ROOT + ".zip")'
          else
            tar -czf "$archive.tar.gz" "$archive"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: portable-agents-${{ matrix.id }}
          path: portable-agents-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-jsr
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {
          pattern: portable-agents-*,
          path: artifacts,
          merge-multiple: true,
        }
      - run: cd artifacts && sha256sum portable-agents-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with: { files: "artifacts/*", body_path: RELEASE_NOTES.md }
